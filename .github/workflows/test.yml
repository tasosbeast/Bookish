name: Bookish checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: bookish
          POSTGRES_PASSWORD: bookish
          POSTGRES_DB: bookish_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bookish -d bookish_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://bookish:bookish@localhost:5432/bookish_test
      TEST_DATABASE_URL: postgresql://bookish:bookish@localhost:5432/bookish_test
      JWT_ACCESS_SECRET: ci-test-access-secret-not-for-production-0123456789
      JWT_REFRESH_SECRET: ci-test-refresh-secret-not-for-production-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:validate
      - run: npm run db:generate
      - run: npm run db:deploy
      - run: npm test -- --test-concurrency=1
      - run: npm run test:integration
      - run: npm ci --prefix frontend
      - run: npm test --prefix frontend
      - run: npm run build --prefix frontend
        env:
          VITE_API_BASE_URL: https://api.example.com/api
