services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: bookish
      POSTGRES_PASSWORD: bookish
      POSTGRES_DB: bookish
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - bookish_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookish -d bookish"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  bookish_data:
